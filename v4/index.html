<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英打遊戲 - 版本四：日式冰淇淋汽水篇</title>
  <style>
    [hidden] { display: none !important; }

    :root {
      font-family: system-ui, "Microsoft JhengHei", -apple-system, sans-serif;
      
      /* --- 日式冰淇淋汽水配色 --- */
      --bg-soda-top: #e0f9f3;     /* 哈密瓜汽水透光淺綠 */
      --bg-soda-bottom: #a2e8dd;  /* 汽水深處綠 */
      
      --glass-border: rgba(255, 255, 255, 0.8);
      --card-bg: rgba(255, 255, 255, 0.85);
      
      --cherry-color: #ff4d6d;    /* 頂端鮮紅櫻桃 */
      --cream-white: #fffdfa;     /* 香草冰淇淋白 */
      --melon-green: #2ec4b6;     /* 汽水綠 */
      
      --text-main: #1b4943;
      --text-muted: #4a7c75;
      
      --key-default: #ffffff;
      --key-active: #ffb4a2;     /* 按對時粉嫩冰淇淋色 */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--bg-soda-top) 0%, var(--bg-soda-bottom) 100%);
      color: var(--text-main);
      overflow: hidden;
      padding: 16px;
    }

    /* 頂部導覽區 */
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      z-index: 10;
    }

    .btn-back {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      padding: 8px 16px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--glass-border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .btn-back:hover { transform: scale(1.05); }

    .score-board {
      font-size: 18px;
      font-weight: 800;
      background: var(--card-bg);
      padding: 6px 18px;
      border-radius: 20px;
      border: 2px solid var(--glass-border);
    }

    /* 遊戲掉落主區域（汽水杯容器風格） */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 380px;
      background: rgba(255, 255, 255, 0.4);
      border: 4px solid var(--glass-border);
      border-radius: 24px 24px 40px 40px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 30px rgba(46, 196, 182, 0.2);
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* 氣泡背景小微動態 */
    .bg-bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      bottom: -20px;
      animation: rise 6s infinite ease-in;
      pointer-events: none;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.8); opacity: 0.7; }
      100% { transform: translateY(-420px) scale(1.2); opacity: 0; }
    }

    /* 掉落中的甜點/字母物件 */
    .falling-item {
      position: absolute;
      width: 52px;
      height: 52px;
      background: var(--cream-white);
      border: 3px solid var(--melon-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: var(--text-main);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      transition: top 0.1s linear;
      z-index: 5;
    }
    /* 字母上面的小櫻桃點綴 */
    .falling-item::before {
      content: "🍒";
      position: absolute;
      top: -14px;
      font-size: 16px;
    }

    /* 消除時的爆破氣泡動畫 */
    .pop-effect {
      position: absolute;
      pointer-events: none;
      animation: pop 0.4s forwards ease-out;
      font-size: 28px;
      z-index: 6;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* 控制面板與滑桿 */
    .controls {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border: 2px solid var(--glass-border);
    }
    .control-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }

    /* 虛擬鍵盤 */
    .keyboard {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 520px;
    }
    .key {
      background: var(--key-default);
      border: 2px solid var(--glass-border);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 16px;
      color: var(--text-main);
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
      transition: all 0.1s;
    }
    .key.active {
      background: var(--key-active);
      color: #fff;
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    }

    /* 按鈕樣式 */
    .btn-main {
      font-weight: 800;
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background: var(--cherry-color);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
      transition: transform 0.15s;
    }
    .btn-main:hover { transform: scale(1.05); }

    /* 結算蓋版Modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="btn-back">🔙 回首頁</a>
    <div class="score-board">🍨 得分: <span id="score">0</span> / 10</div>
  </header>

  <div id="game-container">
    <!-- 背景浮動氣泡 -->
    <div class="bg-bubble" style="left: 10%; width: 15px; height: 15px; animation-duration: 5s;"></div>
    <div class="bg-bubble" style="left: 30%; width: 22px; height: 22px; animation-duration: 7s; animation-delay: 1s;"></div>
    <div class="bg-bubble" style="left: 65%; width: 12px; height: 12px; animation-duration: 4s; animation-delay: 2s;"></div>
    <div class="bg-bubble" style="left: 85%; width: 18px; height: 18px; animation-duration: 6s; animation-delay: 0.5s;"></div>

    <!-- 遊戲中產生的掉落物件 -->
    <div id="item-layer"></div>

    <!-- 遊戲結束Modal -->
    <div id="modal" class="modal" hidden>
      <h2 style="font-size: 32px; margin-bottom: 8px;">🍨 練習完成！</h2>
      <p style="font-size: 18px; font-weight: 700; margin-bottom: 20px;">最終得分：<span id="final-score">0</span> 分</p>
      <button class="btn-main" onclick="startGame()">再喝一杯汽水（重新開始）</button>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="speed-range">掉落時間:</label>
      <input type="range" id="speed-range" min="3" max="14" value="8">
      <span id="speed-val">8</span> 秒
    </div>
    <button id="start-btn" class="btn-main" onclick="startGame()">開始遊戲 🍹</button>
  </div>

  <!-- 10鍵鍵盤區 -->
  <div class="keyboard">
    <div class="key" id="key-A">A</div>
    <div class="key" id="key-S">S</div>
    <div class="key" id="key-D">D</div>
    <div class="key" id="key-F">F</div>
    <div class="key" id="key-G">G</div>
    <div class="key" id="key-H">H</div>
    <div class="key" id="key-J">J</div>
    <div class="key" id="key-K">K</div>
    <div class="key" id="key-L">L</div>
    <div class="key" id="key-;">;</div>
  </div>

  <script>
    const KEYS = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';'];
    let score = 0;
    let totalRounds = 0;
    let currentKey = '';
    let gameInterval = null;
    let itemTop = 0;
    let isPlaying = false;

    const speedRange = document.getElementById('speed-range');
    const speedVal = document.getElementById('speed-val');
    const scoreEl = document.getElementById('score');
    const itemLayer = document.getElementById('item-layer');
    const modal = document.getElementById('modal');
    const finalScoreEl = document.getElementById('final-score');

    speedRange.addEventListener('input', (e) => {
      speedVal.textContent = e.target.value;
    });

    function startGame() {
      score = 0;
      totalRounds = 0;
      scoreEl.textContent = score;
      modal.hidden = true;
      isPlaying = true;
      nextTurn();
    }

    function nextTurn() {
      if (totalRounds >= 10) {
        endGame();
        return;
      }
      
      totalRounds++;
      itemLayer.innerHTML = '';
      currentKey = KEYS[Math.floor(Math.random() * KEYS.length)];
      
      // 亮起底板按鈕
      document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
      const keyEl = document.getElementById(`key-${currentKey}`);
      if (keyEl) keyEl.classList.add('active');

      // 建立掉落物
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.textContent = currentKey;
      
      // 隨機 X 位置
      const containerWidth = document.getElementById('game-container').clientWidth - 60;
      const randomX = Math.floor(Math.random() * containerWidth);
      item.style.left = `${randomX}px`;
      item.style.top = '0px';
      
      itemLayer.appendChild(item);

      itemTop = 0;
      const duration = parseInt(speedRange.value) * 1000;
      const stepTime = 50;
      const stepDist = (320 / (duration / stepTime));

      clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (!isPlaying) return;
        itemTop += stepDist;
        item.style.top = `${itemTop}px`;

        if (itemTop >= 320) {
          // 落地沒按對
          clearInterval(gameInterval);
          nextTurn();
        }
      }, stepTime);
    }

    // 鍵盤按下事件
    window.addEventListener('keydown', (e) => {
      if (!isPlaying) return;
      
      let pressedKey = e.key.toUpperCase();
      if (e.key === ';') pressedKey = ';';

      if (pressedKey === currentKey) {
        // 按對加分
        score++;
        scoreEl.textContent = score;
        
        // 觸發櫻桃汽水氣泡爆裂視覺效果
        const item = document.querySelector('.falling-item');
        if (item) {
          const pop = document.createElement('div');
          pop.className = 'pop-effect';
          pop.textContent = '✨🫧';
          pop.style.left = item.style.left;
          pop.style.top = item.style.top;
          itemLayer.appendChild(pop);
        }

        clearInterval(gameInterval);
        setTimeout(nextTurn, 200);
      }
    });

    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      itemLayer.innerHTML = '';
      finalScoreEl.textContent = score;
      modal.hidden = false;
    }
  </script>
</body>
</html>
