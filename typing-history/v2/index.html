<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英打遊戲版本 2 - 湖水藍夢幻版</title>
  <style>
    :root {
      font-family: system-ui, "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* --- 清澈湖水藍與海洋色盤 --- */
      --bg-lake-start: #e0f7fa;  /* 柔和清澈湖水藍 */
      --bg-lake-mid: #e8fbf8;    /* 水波白光 */
      --bg-lake-end: #c8f2ee;    /* 蒂芬妮綠藍 */
      
      --card-bg: rgba(255, 255, 255, 0.92); /* 半透明透亮卡片 */
      --card-border: #d4f0ed;    /* 湖水清涼邊框 */
      
      --text-main: #2c4a47;      /* 深湖水綠灰文字 */
      --text-muted: #5e8380;     /* 次要湖水文字 */
      --eyebrow: #438f88;        /* 標籤文字色 */
      
      /* --- 按鈕：粉紅草莓馬卡龍色系 --- */
      --btn-bg-start: #ffdae9;   /* 柔粉草莓 */
      --btn-bg-end: #ffc9e0;     /* 深一點的柔粉 */
      --btn-text: #8a576f;       /* 深莓果色文字 */
      --btn-shadow: rgba(255, 182, 193, 0.5);
      
      --focus-ring: #ffb6c1;     /* 焦點外框粉色 */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 清澈湖水漸層背景 */
      background: linear-gradient(135deg, var(--bg-lake-start) 0%, var(--bg-lake-mid) 50%, var(--bg-lake-end) 100%);
      color: var(--text-main);
      line-height: 1.7;
      padding: 32px 20px;
    }

    /* 放大核心遊戲區域容器 */
    main {
      max-width: 920px;
      width: 100%;
      margin: auto;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--eyebrow);
      margin-bottom: 4px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 44px);
      margin: 0 0 10px 0;
      color: var(--text-main);
      font-weight: 800;
    }

    p {
      margin: 8px 0 16px 0;
      font-size: 16px;
    }

    /* 加大的湖水透亮風格卡片 */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: 36px 40px;
      margin: 20px 0;
      box-shadow: 
        0 14px 30px rgba(45, 110, 103, 0.06),
        0 6px 12px rgba(45, 110, 103, 0.03);
    }

    /* 鍵盤圖片展示區 */
    #keyboardImage {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      border-radius: 20px;
      border: 1px solid #d8f1ee;
      background: #f7fcfb;
      margin-bottom: 24px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .row {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .row span {
      font-size: 15px;
      color: var(--text-muted);
    }

    /* 粉紅馬卡龍按鈕 */
    button {
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 14px 38px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(145deg, var(--btn-bg-start), var(--btn-bg-end));
      color: var(--btn-text);
      cursor: pointer;
      box-shadow: 0 6px 16px var(--btn-shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      top: 0;
    }

    button:hover:not(:disabled) {
      top: -2px;
      filter: brightness(1.02);
      box-shadow: 0 8px 22px var(--btn-shadow);
    }

    button:active:not(:disabled) {
      top: 1px;
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.2);
    }

    #message {
      min-height: 2em;
      margin: 12px 0 0 0;
      font-size: 16px;
      font-weight: 600;
      color: #3b6e68;
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .panel {
        padding: 22px 20px;
      }
    }
  </style>
</head>
<body>

<main>
  <p class="eyebrow">TYPING PREVIEW</p>
  <h1>英打遊戲版本 2</h1>
  <p>先暖暖手，遊戲即將登場。</p>

  <section class="panel">
    <img id="keyboardImage" src="keyboard.png" alt="英文鍵盤示意圖，中央列為 ASDFGHJKL 與分號">
    
    <div class="row">
      <button id="start" type="button">開始</button>
      <span>按下後會發出兩聲嗶聲。</span>
    </div>
    
    <p id="message" role="status">這是預告畫面，尚未開放打字遊戲。</p>
    
    <audio id="beep" preload="auto" src="beep.wav"></audio>
  </section>
</main>

<script>
  const button = document.getElementById('start');
  const sound = document.getElementById('beep');
  const message = document.getElementById('message');

  document.getElementById('keyboardImage').addEventListener('error', () => {
    message.textContent = '圖片未載入，請確認是否有將 keyboard.png 與 HTML 放在同一個資料夾。';
  });

  button.addEventListener('click', async () => {
    button.disabled = true;
    sound.currentTime = 0;
    try {
      await sound.play();
      message.textContent = '嗶嗶！這是遊戲預告，目前還不能玩。';
    } catch(e) {
      message.textContent = '聲音無法播放，請檢查聲音檔與路徑，並確認瀏覽器允許播放。';
      button.disabled = false;
    }
  });

  sound.addEventListener('ended', () => button.disabled = false);

  sound.addEventListener('error', () => {
    button.disabled = false;
    message.textContent = '聲音檔未載入，請確認是否有將 beep.wav 一起放到資料夾中。';
  });
</script>

</body>
</html>
