<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英打遊戲版本 4 - 接住掉落字母</title>
  <style>
    [hidden] { display: none !important; }

    :root {
      font-family: system-ui, "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* --- 清澈湖水藍與海洋色盤 --- */
      --bg-lake-start: #e0f7fa;  /* 柔和清澈湖水藍 */
      --bg-lake-mid: #e8fbf8;    /* 水波白光 */
      --bg-lake-end: #c8f2ee;    /* 蒂芬妮綠藍 */
      
      --card-bg: rgba(255, 255, 255, 0.93); /* 透亮卡片 */
      --card-border: #d4f0ed;    /* 湖水清涼邊框 */
      
      --text-main: #2c4a47;      /* 深湖水綠灰文字 */
      --text-muted: #5e8380;     /* 次要湖水文字 */
      --eyebrow: #438f88;        /* 標籤文字色 */
      
      /* --- 按鈕：粉紅草莓馬卡龍色系 --- */
      --btn-bg-start: #ffdae9;   /* 柔粉草莓 */
      --btn-bg-end: #ffc9e0;     /* 深一點的柔粉 */
      --btn-text: #8a576f;       /* 深莓果色文字 */
      --btn-shadow: rgba(255, 182, 193, 0.5);
      
      --btn-sec-bg: #f0faf8;     /* 次要按鈕 */
      --btn-sec-text: #376e67;
      --btn-sec-border: #bce3df;

      --focus-ring: #ffb6c1;     /* 焦點外框粉色 */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-lake-start) 0%, var(--bg-lake-mid) 50%, var(--bg-lake-end) 100%);
      color: var(--text-main);
      line-height: 1.7;
      padding: 32px 20px;
    }

    main {
      max-width: 920px;
      width: 100%;
      margin: auto;
    }

    a {
      color: #388e85;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 12px;
      transition: color 0.2s;
    }
    a:hover { color: #225c56; text-decoration: underline; }

    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--eyebrow);
      margin: 0 0 4px 0;
    }

    h1 {
      font-size: clamp(30px, 5vw, 42px);
      margin: 0 0 8px 0;
      color: var(--text-main);
      font-weight: 800;
    }

    p { margin: 8px 0 16px 0; font-size: 16px; }

    /* 控制控制項 Panel */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      padding: 24px 32px;
      margin: 18px 0;
      box-shadow: 
        0 12px 28px rgba(45, 110, 103, 0.05),
        0 6px 12px rgba(45, 110, 103, 0.02);
    }

    .controls {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }
    .controls label {
      flex: 1;
      min-width: 240px;
      font-size: 15px;
      font-weight: 600;
    }
    .controls small {
      display: block;
      color: var(--text-muted);
      font-weight: normal;
      margin-top: 4px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #ff91b8;
      margin-top: 8px;
      cursor: pointer;
    }

    input[type=checkbox] {
      accent-color: #ff91b8;
      transform: scale(1.15);
      margin-right: 6px;
      cursor: pointer;
    }

    /* 按鈕樣式 */
    button {
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(145deg, var(--btn-bg-start), var(--btn-bg-end));
      color: var(--btn-text);
      cursor: pointer;
      box-shadow: 0 5px 14px var(--btn-shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      top: 0;
    }

    button:hover:not(:disabled) {
      top: -2px;
      filter: brightness(1.02);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    button:active:not(:disabled) {
      top: 1px;
      box-shadow: 0 2px 8px var(--btn-shadow);
    }

    button.secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 2px solid var(--btn-sec-border);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
    }
    button.secondary:hover:not(:disabled) {
      background: #e1f5f2;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.2);
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .row span { font-size: 15px; color: var(--text-muted); }

    .game { text-align: center; outline-offset: 5px; }

    /* 得分列 */
    .score {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .score span {
      background: #e8f7f5;
      color: #2a5a54;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #d0eeeb;
    }
    .score b {
      font-size: 20px;
      color: #1f6b62;
      margin-left: 4px;
    }

    /* 天空與掉落物區域 */
    .sky {
      height: 320px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(180deg, #dcf5f2 0%, #f7fcfb 80%, #d8f2ec 100%);
      border-bottom: 8px solid #a3ded3;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }
    .sky::before {
      content: '☁️ 落地前，按下對應的英文字母';
      position: absolute;
      top: 14px;
      left: 18px;
      color: #558781;
      font-size: 14px;
      font-weight: 600;
    }

    /* 掉落方塊 (馬卡龍草莓粉) */
    .falling {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(145deg, #ff9bbd, #ff7ba5);
      color: white;
      font-size: 38px;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(255, 123, 165, 0.4);
      transition: top 0.05s linear;
    }

    /* 鍵盤區域 */
    .keyboard-wrap {
      overflow-x: auto;
      padding: 16px 0 10px 0;
    }
    .keyboard {
      min-width: 600px;
      max-width: 780px;
      margin: auto;
      background: #e3f3f1;
      padding: 16px;
      border-radius: 22px;
      border: 2px solid #ceebe7;
    }
    .keyrow {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 8px 0;
    }
    .key {
      display: grid;
      place-items: center;
      width: 52px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid #b2dad5;
      border-bottom-width: 4px;
      background: #ffffff;
      color: #4b6b66;
      font-size: 20px;
      font-weight: 700;
      transition: all 0.15s ease;
      position: relative;
    }
    .key.practice {
      background: #fff3f8;
      color: #8c4e68;
      border-color: #f7cbdc;
    }
    .key.lit {
      background: #ff7aa2 !important;
      color: white !important;
      border-color: #e04a78 !important;
      box-shadow: 0 0 0 4px #ffe0eb;
      transform: translateY(-3px);
    }
    .key.lit::after {
      content: '●';
      font-size: 8px;
      line-height: 1;
      position: absolute;
      bottom: 4px;
    }

    #message {
      min-height: 2em;
      margin: 16px 0 0 0;
      font-size: 16px;
      font-weight: 700;
      color: #3b6e68;
    }

    .help {
      font-size: 14px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.6);
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .panel { padding: 22px 18px; }
      .sky { height: 260px; }
    }
  </style>
</head>
<body>

<main>
  <a href="../index.html">← 回開發歷程</a>
  <p class="eyebrow">VERSION 04 · CATCH THE LETTERS</p>
  <h1>英打遊戲版本 4</h1>
  <p>在字母落地之前按對按鍵。練習 A S D F G H J K L ;。</p>

  <section class="panel">
    <div class="controls">
      <label for="speed">
        每個字母落地時間：<strong id="speedLabel">8 秒</strong>
        <input id="speed" type="range" min="3" max="14" step="1" value="8">
        <small>秒數越大，掉得越慢。初學可用 10～14 秒。</small>
      </label>
      <label>
        <input id="auto" type="checkbox"> 漸進加速：每答對三題縮短一秒，最快三秒
      </label>
    </div>

    <div class="row">
      <button id="start" type="button">開始／重新開始</button>
      <button id="pause" type="button" class="secondary" disabled>暫停</button>
      <span>目前落地時間：<b id="actual">8 秒</b></span>
    </div>
  </section>

  <section id="play" tabindex="0" class="panel game" aria-label="掉落字母遊戲">
    <div class="score">
      <span>接住 <b id="score">0</b></span>
      <span>落地 <b id="miss">0</b></span>
      <span>按錯 <b id="wrong">0</b></span>
      <span>完成 <b id="round">0</b> / 10</span>
    </div>

    <div id="sky" class="sky">
      <div id="falling" class="falling" hidden>—</div>
    </div>

    <div class="keyboard-wrap">
      <div class="keyboard" aria-label="英文鍵盤，紅色並有圓點的按鍵是目前目標">
        <div class="keyrow">
          <span class="key" data-key="q">Q</span>
          <span class="key" data-key="w">W</span>
          <span class="key" data-key="e">E</span>
          <span class="key" data-key="r">R</span>
          <span class="key" data-key="t">T</span>
          <span class="key" data-key="y">Y</span>
          <span class="key" data-key="u">U</span>
          <span class="key" data-key="i">I</span>
          <span class="key" data-key="o">O</span>
          <span class="key" data-key="p">P</span>
        </div>
        <div class="keyrow">
          <span class="key practice" data-key="a">A</span>
          <span class="key practice" data-key="s">S</span>
          <span class="key practice" data-key="d">D</span>
          <span class="key practice" data-key="f">F</span>
          <span class="key practice" data-key="g">G</span>
          <span class="key practice" data-key="h">H</span>
          <span class="key practice" data-key="j">J</span>
          <span class="key practice" data-key="k">K</span>
          <span class="key practice" data-key="l">L</span>
          <span class="key practice" data-key=";">;</span>
        </div>
        <div class="keyrow">
          <span class="key" data-key="z">Z</span>
          <span class="key" data-key="x">X</span>
          <span class="key" data-key="c">C</span>
          <span class="key" data-key="v">V</span>
          <span class="key" data-key="b">B</span>
          <span class="key" data-key="n">N</span>
          <span class="key" data-key="m">M</span>
        </div>
      </div>
    </div>

    <p id="message" role="status">按開始，用實體鍵盤接住字母；每次只出現一個。</p>
  </section>

  <p class="help">
    💡 提示：請切換英文輸入。按錯不消除目標；落地記錄一次，不扣生命。長按不連續消除。調整設定、切換分頁或離開視窗會暫停，按繼續恢復。
  </p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const keyNodes = [...document.querySelectorAll('[data-key]')];

  function chooseKey(keys, previous, random = Math.random) {
    const pool = keys.filter(k => k !== previous);
    return pool[Math.floor(random() * pool.length)];
  }

  function markKey(key) {
    keyNodes.forEach(node => node.classList.toggle('lit', node.dataset.key === key));
  }

  function isControl(target) {
    return target instanceof Element && !!target.closest('input,select,textarea,button,a,summary');
  }

  function inputKey(e) {
    return e.isComposing || e.ctrlKey || e.metaKey || e.altKey || e.repeat ? null : String(e.key).toLowerCase();
  }

  const KEYS = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';'];
  const ROUND_LENGTH = 10;

  let state = { running: false, paused: false, score: 0, miss: 0, wrong: 0, done: 0, target: null, y: 0 };
  let lastTime = null;

  function fallSeconds(base, score, auto) {
    return Math.max(3, base - (auto ? Math.floor(score / 3) : 0));
  }

  function seconds() {
    return fallSeconds(Number($('speed').value), state.score, $('auto').checked);
  }

  function render() {
    $('score').textContent = state.score;
    $('miss').textContent = state.miss;
    $('wrong').textContent = state.wrong;
    $('round').textContent = state.done;
    $('speedLabel').textContent = $('speed').value + ' 秒';
    $('actual').textContent = seconds() + ' 秒';
    $('pause').disabled = !state.running;
    $('pause').textContent = state.paused ? '繼續' : '暫停';
    $('falling').hidden = !state.running;
    $('falling').style.top = (12 + state.y * ($('sky').clientHeight - 80)) + 'px';
  }

  function next() {
    state.target = chooseKey(KEYS, state.target);
    state.y = 0;
    $('falling').textContent = state.target.toUpperCase();
    markKey(state.target);
  }

  function finishLetter(hit) {
    if (hit) state.score++;
    else state.miss++;
    
    state.done++;

    if (state.done >= ROUND_LENGTH) {
      state.running = false;
      state.target = null;
      markKey(null);
      $('message').textContent = '🎉 本回合完成！接住 ' + state.score + ' 個，落地 ' + state.miss + ' 個。可調整速度再挑戰。';
    } else {
      next();
      $('message').textContent = hit ? '✨ 接住了！準備下一個。' : '💦 落地了，沒關係，下一個再試。';
    }
    render();
  }

  function advance(dt) {
    if (!state.running || state.paused) return;
    state.y += dt / seconds();
    if (state.y >= 1) finishLetter(false);
    render();
  }

  function start() {
    state = { running: true, paused: false, score: 0, miss: 0, wrong: 0, done: 0, target: null, y: 0 };
    lastTime = null;
    next();
    render();
    $('message').textContent = '開始！一回合十個字母，落地不結束遊戲。';
    $('play').focus();
  }

  function pause(value) {
    if (!state.running) return;
    state.paused = value;
    lastTime = null;
    render();
    $('message').textContent = value ? '已暫停，按「繼續」後再玩。' : '繼續挑戰！';
  }

  $('start').addEventListener('click', start);
  $('pause').addEventListener('click', () => {
    pause(!state.paused);
    $('play').focus();
  });

  $('speed').addEventListener('input', () => { render(); });
  $('auto').addEventListener('change', render);

  for (const id of ['speed', 'auto']) {
    $(id).addEventListener('focus', () => pause(true));
  }

  document.addEventListener('keydown', e => {
    if (!state.running || state.paused || isControl(e.target)) return;
    const key = inputKey(e);
    if (!key || !/^[a-z;]$/.test(key)) return;
    
    e.preventDefault();
    if (key === state.target) {
      finishLetter(true);
    } else {
      state.wrong++;
      $('message').textContent = '❌ 不是這一個，請按 ' + state.target.toUpperCase() + '。';
      render();
    }
  });

  function frame(t) {
    if (lastTime !== null) {
      advance(Math.min((t - lastTime) / 1000, 0.1));
    }
    lastTime = t;
    requestAnimationFrame(frame);
  }

  window.addEventListener('blur', () => pause(true));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pause(true);
  });

  render();
  requestAnimationFrame(frame);
</script>

</body>
</html>
