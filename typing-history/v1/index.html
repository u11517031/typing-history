<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英打遊戲版本一 - 馬卡龍甜點版</title>
  <style>
    :root {
      font-family: system-ui, "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* --- 馬卡龍甜點色盤 --- */
      --bg-pink: #fff0f5;       /* 薰衣草粉紅 (極淺) */
      --bg-green: #f0fff4;      /* 蜜瓜綠 (極淺) */
      
      --card-bg: #ffffff;       /* 純白卡片 */
      --card-border: #f1e4eb;   /* 淡淡的粉色邊框 */
      
      --text-main: #5c4f55;     /* 帶點可可色的深灰 */
      
      /* --- 按鈕：薄荷綠馬卡龍色系 --- */
      --btn-bg-start: #d3f8e2;  /* 淺薄荷綠 */
      --btn-bg-end: #b9f2d1;    /* 稍微深一點的薄荷綠 */
      --btn-text: #2d5e46;      /* 抹茶可可色文字 */
      --btn-shadow: rgba(185, 242, 209, 0.6);
      
      --focus-ring: #a8ebd0;    /* 焦點外框色 */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-pink) 0%, #ffffff 50%, var(--bg-green) 100%);
      color: var(--text-main);
      line-height: 1.7;
    }

    main {
      background: var(--card-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      
      border: 2px solid var(--card-border);
      border-radius: 30px;
      padding: 50px 60px;
      box-shadow: 
        0 10px 20px rgba(0, 0, 0, 0.02),
        0 6px 6px rgba(0, 0, 0, 0.03);
      text-align: center;
      max-width: 500px;
      width: 90%;
      transition: transform 0.3s ease;
    }
    
    main:hover {
        transform: translateY(-3px);
    }

    h1 {
      font-size: clamp(26px, 4vw, 34px);
      margin: 0 0 30px 0;
      color: var(--text-main);
      letter-spacing: -0.5px;
      font-weight: 800;
    }

    button {
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      padding: 15px 45px;
      border: none;
      border-radius: 50px;
      
      /* 薄荷綠馬卡龍漸層 */
      background: linear-gradient(145deg, var(--btn-bg-start), var(--btn-bg-end));
      color: var(--btn-text);
      cursor: pointer;
      
      box-shadow: 0 6px 15px var(--btn-shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      top: 0;
    }

    button:hover {
      top: -2px;
      filter: brightness(1.02);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    button:active {
      top: 1px;
      box-shadow: 0 3px 10px var(--btn-shadow);
      filter: brightness(0.98);
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 4px;
    }
  </style>
</head>
<body>

  <main>
    <h1>英打遊戲版本一</h1>
    <button type="button">開始練習</button>
  </main>

</body>
</html>
